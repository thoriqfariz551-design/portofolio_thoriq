<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Nilai | A. Fauruz Thoriq</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container navbar">
      <h1>A. Fauruz Thoriq</h1>
      <nav>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="proyek.html">Proyek</a></li>
          <li><a href="kontak.html">Kontak</a></li>
           <li><a href="kalkulator.html" class="aktif">Kalkulator</a></li>
          <li><button class="tombol-tema">🌙</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h2>Kalkulator Nilai</h2>
      <p>Hitung nilai akhir dan predikat kamu secara otomatis.</p>

      <section class="kartu">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" placeholder="Nama kamu">

        <label for="tugas">Nilai Tugas:</label>
        <input type="number" id="tugas" placeholder="0 - 100" min="0" max="100">

        <label for="uts">Nilai UTS:</label>
        <input type="number" id="uts" placeholder="0 - 100" min="0" max="100">

        <label for="uas">Nilai UAS:</label>
        <input type="number" id="uas" placeholder="0 - 100" min="0" max="100">

        <br><br>
        <button class="filter-btn aktif" onclick="hitungNilai()">Hitung Nilai</button>
        <button class="filter-btn" onclick="resetNilai()">Reset</button>

        <div id="hasil" style="margin-top: 20px;"></div>
      </section>

    
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Akhmad Fauruz Thoriq. Dibuat di Kelas Industri UBIG.</p>
  </footer>

  <script>
    function hitungNilai() {
      const nama = document.getElementById("nama").value;
      const tugas = Number(document.getElementById("tugas").value);
      const uts = Number(document.getElementById("uts").value);
      const uas = Number(document.getElementById("uas").value);

      if (!nama || tugas === "" || uts === "" || uas === "") {
        document.getElementById("hasil").innerHTML = "<p style='color:red'>Isi semua kolom dulu!</p>";
        return;
      }

      // Hitung nilai akhir: Tugas 30% + UTS 30% + UAS 40%
      const akhir = (tugas * 0.3) + (uts * 0.3) + (uas * 0.4);

      let predikat = "";
      let status = "";

      if (akhir >= 90) { predikat = "A"; status = "Lulus 🎉"; }
      else if (akhir >= 80) { predikat = "B"; status = "Lulus 🎉"; }
      else if (akhir >= 70) { predikat = "C"; status = "Lulus"; }
      else if (akhir >= 60) { predikat = "D"; status = "Tidak Lulus"; }
      else { predikat = "E"; status = "Tidak Lulus"; }

      document.getElementById("hasil").innerHTML = `
        <h3>Hasil untuk ${nama}</h3>
        <p>Nilai Akhir: <b>${akhir.toFixed(1)}</b></p>
        <p>Predikat: <b>${predikat}</b></p>
        <p>Status: <b>${status}</b></p>
      `;
    }

    function resetNilai() {
      document.getElementById("nama").value = "";
      document.getElementById("tugas").value = "";
      document.getElementById("uts").value = "";
      document.getElementById("uas").value = "";
      document.getElementById("hasil").innerHTML = "";
    }
  </script>
  <script src="logika.js"></script>
</body>
</html>
