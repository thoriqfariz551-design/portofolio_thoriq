<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Nilai</title>
  <link rel="icon" href="img/icon.png">
  <script src="kalkulator.js" defer></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding-top: 60px;
      min-height: 100vh;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      height: fit-content;
    }
    h1 {
      text-align: center;
      color: #0b66c3;
      margin: 0 0 28px 0;
      font-size: 28px;
    }
    label { display: block; margin-bottom: 8px; color: #333; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }
    input:focus { border-color: #0b66c3; }
    button {
      width: 100%;
      background: #0b66c3;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #0956a3; }
    #hasil {
      margin-top: 20px;
      background: #f8f9fa;
      padding: 16px;
      border-radius: 6px;
      line-height: 1.6;
      display: none;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kalkulator Nilai</h1>

    <label>Nilai Tugas</label>
    <input type="number" id="tugas" placeholder="0 - 100">

    <label>Nilai UTS</label>
    <input type="number" id="uts" placeholder="0 - 100">

    <label>Nilai UAS</label>
    <input type="number" id="uas" placeholder="0 - 100">

    <button id="btnHitung">Hitung Nilai</button>

    <div id="hasil"></div>
  </div>
</body>
</html>
