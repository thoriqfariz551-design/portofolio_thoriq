  <main>
    <div class="container">
      <h2>Hubungi Saya</h2>
      <section class="kartu">
        <form id="form-kontak">
          <label for="nama">Nama:</label>
          <input type="text" id="nama" required placeholder="Nama kamu">
         <!-- Tambahan: Email -->
<div class="form-group">
  <label for="email">Email:</label>
  <input 
    type="email" 
    id="email" 
    name="email" 
    placeholder="nama@gmail.com" 
    required
  >
</div>

<!-- Tambahan: Nomor HP -->
<div class="form-group">
  <label for="noHP">Nomor HP:</label>
  <input 
    type="tel" 
    id="noHP" 
    name="noHP" 
    placeholder="081234567890" 
    pattern="[0-9]{10,13}"
    required
  >
</div>
          <label for="keperluan">Keperluan:</label>
          <select id="keperluan" required>
            <option value="">Pilih keperluan</option>
            <option value="Bertanya">Bertanya</option>
            <option value="Kerjasama">Kerjasama</option>
            <option value="Lainnya">Lainnya</option>
          </select>

          <label for="pesan">Pesan:</label>
          <textarea id="pesan" rows="4" maxlength="200" required placeholder="Tulis pesanmu..."></textarea>
          <p id="hitung-karakter">0 / 200 karakter</p>

          <button type="submit" class="tombol">Kirim Pesan</button>
        </form>
        <p id="hasil-pesan"></p>
      </section>
    </div>
