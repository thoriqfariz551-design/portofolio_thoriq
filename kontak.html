  <meta name="description" content="Hubungi A. Fauruz Thoriq melalui formulir kontak untuk bertanya, kerjasama, atau keperluan lainnya. Respon cepat untuk siswa SMKN 1 Pasuruan.">
  <link rel="icon" href="data:,">

<body>
  <header>
    <div class="container navbar">
      <h1>A. Fauruz Thoriq</h1>
      <nav>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="proyek.html">Proyek</a></li>
          <li><a href="kontak.html" class="aktif" aria-current="page">Kontak</a></li>
          <li><a href="kalkulator.html">Kalkulator</a></li>
          <li><button class="tombol-tema" aria-label="Ganti tema gelap dan terang">🌙</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h2>Hubungi Saya</h2>
      <section class="kartu">
        <form id="form-kontak">
          <div class="form-group">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" required placeholder="Nama kamu" autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="nama@gmail.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="noHP">Nomor HP:</label>
            <input type="tel" id="noHP" name="noHP" placeholder="081234567890" pattern="[0-9]{10,13}" required autocomplete="tel">
          </div>

          <div class="form-group">
            <label for="keperluan">Keperluan:</label>
            <select id="keperluan" name="keperluan" required>
              <option value="">Pilih keperluan</option>
              <option value="Bertanya">Bertanya</option>
              <option value="Kerjasama">Kerjasama</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <div class="form-group">
            <label for="pesan">Pesan:</label>
            <textarea id="pesan" name="pesan" rows="4" maxlength="200" required placeholder="Tulis pesanmu..."></textarea>
            <p id="hitung-karakter" aria-live="polite">0 / 200 karakter</p>
          </div>

          <button type="submit" class="tombol">Kirim Pesan</button>
        </form>
        <p id="hasil-pesan" aria-live="polite"></p>
      </section>
    </div>
  </main>

  </footer>

</body>
